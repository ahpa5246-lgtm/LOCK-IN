name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore LOCK-IN.sln
      - name: Build
        run: dotnet build LOCK-IN.sln -c Release --no-restore
      - name: Test
        env:
          LOCKIN_UI_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/ui-evidence
        run: dotnet test LOCK-IN.sln -c Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: Upload WPF UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LOCK-IN-ui-evidence-${{ github.sha }}
          path: artifacts/ui-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish Windows x64
        run: dotnet publish src/LockIn.App/LockIn.App.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/publish
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y --limit-output
      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\LockIn.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: LOCK-IN-windows
          path: |
            artifacts/publish
            artifacts/LOCK-IN-Setup.exe
          if-no-files-found: error
